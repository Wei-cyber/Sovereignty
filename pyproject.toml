[project]
name = "enterprise-ai-workspace"
version = "0.1.0"
description = "Private, evaluated knowledge workflows for enterprise teams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23,<26",
  "openai>=1.70,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "langgraph-checkpoint-sqlite>=2,<4",
  "celery[redis]>=5.5,<6",
  "pypdf>=5,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "numpy>=1.26,<3",
  "mcp>=2,<3",
  "cryptography>=46,<48",
  "beautifulsoup4>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a dedicated PostgreSQL test database", "live: incurs model API usage"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
