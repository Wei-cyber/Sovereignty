use_default_settings:
  engines:
    keep_only: [duckduckgo, bing, wikipedia]
general:
  debug: false
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats: [html, json]
  safe_search: 1
outgoing:
  request_timeout: 6.0
  max_request_timeout: 8.0
