name: Validate workspace
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts migrations
      - run: uv run pytest --cov=backend --cov-report=term-missing
      - run: uv run python -m backend.manage openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - run: uv sync --frozen
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: relay_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay -d relay_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay:ci-test-only@localhost:5432/relay_ci_test
